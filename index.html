<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tapha Belay - English & Afan Oromo</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            display: none;
        }
        #timerDisplay {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            display: none;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
            pointer-events: none;
            display: none;
        }
        #menuScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            color: white;
        }
        #menuScreen h1 {
            font-size: 48px;
            margin-bottom: 10px;
            color: #ffcc00;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
        }
        #menuScreen p {
            font-size: 20px;
            margin-bottom: 30px;
            color: #ddd;
        }
        .timer-btn {
            background: #ff5722;
            color: white;
            border: none;
            padding: 15px 35px;
            margin: 10px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .timer-btn:hover {
            background: #f4511e;
            transform: scale(1.05);
        }
        #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            color: white;
        }
        #gameOverScreen h2 {
            font-size: 42px;
            margin-bottom: 15px;
            color: #ffcc00;
        }
        #gameOverScreen p {
            font-size: 22px;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>

<!-- Menu Screen -->
<div id="menuScreen">
    <h1>Tapha Belay</h1>
    <p>Select Game Time:</p>
    <div>
        <button class="timer-btn" onclick="startGame(1)">1 Minute</button>
        <button class="timer-btn" onclick="startGame(3)">3 Minutes</button>
        <button class="timer-btn" onclick="startGame(5)">5 Minutes</button>
    </div>
</div>

<!-- Game Over Screen -->
<div id="gameOverScreen">
    <h2>Time's Up!</h2>
    <p>Final Score: <span id="finalScore">0</span> | Total Coins: <span id="finalCoins">0</span> | Reached Level: <span id="finalLevel">1</span></p>
    <button class="timer-btn" onclick="location.reload()">Play Again</button>
</div>

<div id="ui">Coins: <span id="coinCount">0</span> | Score: <span id="scoreCount">0</span> | Level: <span id="levelCount">1</span></div>
<div id="timerDisplay">Time: <span id="timeRemaining">00:00</span></div>
<div id="instructions">
    Use <b>Left/Right Arrows</b> to move &bull; Press <b>Up Arrow</b> to shoot stones!
</div>

<!-- Include Three.js for 3D graphics -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    // --- Game Setup ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb); // Sky blue background

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 5, 15);
    camera.lookAt(0, 3, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(10, 20, 15);
    scene.add(dirLight);

    // --- Game State ---
    let coins = 0;
    let score = 0;
    let currentLevel = 1;
    let gameActive = false;
    let timeRemaining = 0;
    let timerInterval = null;
    let spawnInterval = null;
    const keys = {};

    // --- Dual-Language Vocabulary List ---
    const vocabList = [
        { en: "Red", or: "Diimaa" },
        { en: "Black", or: "Gurraacha" },
        { en: "White", or: "Adii" },
        { en: "Sun", or: "Aduu" },
        { en: "Water", or: "Bishaan" },
        { en: "House", or: "Mana" },
        { en: "Tree", or: "Muka" },
        { en: "Child", or: "Daaqicha" },
        { en: "Book", or: "Kitaaba" },
        { en: "Sky", or: "Waaqayyoo" }
    ];

    // --- Create Gun / Slingshot ---
    const gunGroup = new THREE.Group();

    // Base / Handle
    const handleGeo = new THREE.CylinderGeometry(0.2, 0.3, 1.5, 8);
    const handleMat = new THREE.MeshStandardMaterial({ color: 0x5c4033 });
    const handle = new THREE.Mesh(handleGeo, handleMat);
    handle.rotation.z = Math.PI / 12;
    gunGroup.add(handle);

    // Barrel / Y-Frame
    const barrelGeo = new THREE.BoxGeometry(0.4, 1.2, 0.4);
    const barrelMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
    const barrel = new THREE.Mesh(barrelGeo, barrelMat);
    barrel.position.y = 1;
    gunGroup.add(barrel);

    gunGroup.position.set(0, 0, 10);
    scene.add(gunGroup);

    // --- Bullets (Stones) ---
    const stones = [];
    const stoneGeo = new THREE.SphereGeometry(0.3, 8, 8);
    const stoneMat = new THREE.MeshStandardMaterial({ color: 0x7f8c8d, roughness: 0.9 });

    // --- Balloons ---
    const balloons = [];
    const balloonColors = [0xff0000, 0xffffff, 0x111111]; // Red, White, Black

    function createBalloon() {
        if (!gameActive) return;
        const balloonGroup = new THREE.Group();

        const color = balloonColors[Math.floor(Math.random() * balloonColors.length)];
        const matProps = { color: color, roughness: 0.3, metalness: 0.1 };
        if(color === 0xffffff) matProps.emissive = 0x222222;

        const balloonGeo = new THREE.SphereGeometry(1, 32, 32);
        const balloonMat = new THREE.MeshStandardMaterial(matProps);
        const body = new THREE.Mesh(balloonGeo, balloonMat);
        body.scale.set(1, 1.3, 1);
        balloonGroup.add(body);

        const knotGeo = new THREE.ConeGeometry(0.15, 0.3, 8);
        const knotMat = new THREE.MeshStandardMaterial({ color: color });
        const knot = new THREE.Mesh(knotGeo, knotMat);
        knot.position.y = 1.3;
        balloonGroup.add(knot);

        const vocab = vocabList[Math.floor(Math.random() * vocabList.length)];

        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 256;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = (color === 0xffffff) ? '#000000' : '#ffffff';
        ctx.font = 'bold 42px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(vocab.en, 256, 90);
        ctx.font = 'bold 36px sans-serif';
        ctx.fillText(vocab.or, 256, 170);

        const texture = new THREE.CanvasTexture(canvas);
        const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true });
        const sprite = new THREE.Sprite(spriteMat);
        sprite.scale.set(2.5, 1.25, 1);
        sprite.position.set(0, 0, 1.05);
        balloonGroup.add(sprite);

        balloonGroup.position.x = (Math.random() - 0.5) * 16;
        balloonGroup.position.y = 12;
        balloonGroup.position.z = (Math.random() - 0.5) * 5 - 2;

        scene.add(balloonGroup);

        // Speed scales up based on current level (e.g., +25% speed increase per level)
        const baseSpeed = 0.03 + Math.random() * 0.04;
        const speedMultiplier = 1 + (currentLevel - 1) * 0.25;

        balloons.push({
            mesh: balloonGroup,
            speed: baseSpeed * speedMultiplier
        });
    }

    // Dynamic Spawner based on level
    function setupSpawner() {
        if (spawnInterval) clearInterval(spawnInterval);

        // Spawn interval gets faster as level increases, down to a minimum cap of 400ms
        const intervalTime = Math.max(400, 1200 - (currentLevel - 1) * 150);

        spawnInterval = setInterval(() => {
            if (gameActive && balloons.length < (6 + currentLevel * 2)) {
                createBalloon();
            }
        }, intervalTime);
    }

    // --- Input Listeners ---
    window.addEventListener('keydown', (e) => {
        if (!gameActive) return;
        keys[e.code] = true;
        if (e.code === 'ArrowUp') {
            shootStone();
        }
    });

    window.addEventListener('keyup', (e) => {
        keys[e.code] = false;
    });

    function shootStone() {
        const stone = new THREE.Mesh(stoneGeo, stoneMat);
        stone.position.copy(gunGroup.position);
        stone.position.y += 1.2;
        scene.add(stone);
        stones.push(stone);
    }

    // --- Start Game Function ---
    function startGame(minutes) {
        document.getElementById('menuScreen').style.display = 'none';
        document.getElementById('ui').style.display = 'block';
        document.getElementById('timerDisplay').style.display = 'block';
        document.getElementById('instructions').style.display = 'block';

        timeRemaining = minutes * 60;
        score = 0;
        coins = 0;
        currentLevel = 1;

        document.getElementById('scoreCount').innerText = score;
        document.getElementById('coinCount').innerText = coins;
        document.getElementById('levelCount').innerText = currentLevel;

        updateTimerDisplay();
        gameActive = true;

        setupSpawner();

        timerInterval = setInterval(() => {
            timeRemaining--;
            updateTimerDisplay();
            if (timeRemaining <= 0) {
                endGame();
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const mins = Math.floor(timeRemaining / 60);
        const secs = timeRemaining % 60;
        document.getElementById('timeRemaining').innerText =
            `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function endGame() {
        gameActive = false;
        clearInterval(timerInterval);
        clearInterval(spawnInterval);

        // Clear remaining balloons and stones
        balloons.forEach(b => scene.remove(b.mesh));
        balloons.length = 0;
        stones.forEach(s => scene.remove(s));
        stones.length = 0;

        document.getElementById('finalScore').innerText = score;
        document.getElementById('finalCoins').innerText = coins;
        document.getElementById('finalLevel').innerText = currentLevel;
        document.getElementById('gameOverScreen').style.display = 'flex';
        document.getElementById('ui').style.display = 'none';
        document.getElementById('timerDisplay').style.display = 'none';
        document.getElementById('instructions').style.display = 'none';
    }

    // --- Game Loop ---
    function animate() {
        requestAnimationFrame(animate);

        if (gameActive) {
            // Move Gun with Left/Right arrows
            const moveSpeed = 0.25;
            if (keys['ArrowLeft'] && gunGroup.position.x > -8) {
                gunGroup.position.x -= moveSpeed;
            }
            if (keys['ArrowRight'] && gunGroup.position.x < 8) {
                gunGroup.position.x += moveSpeed;
            }

            // Update Stones
            for (let i = stones.length - 1; i >= 0; i--) {
                stones[i].position.z -= 0.6; // Fly forward

                if (stones[i].position.z < -20) {
                    scene.remove(stones[i]);
                    stones.splice(i, 1);
                    continue;
                }

                // Check collisions with balloons
                for (let j = balloons.length - 1; j >= 0; j--) {
                    const b = balloons[j];
                    const distance = stones[i].position.distanceTo(b.mesh.position);

                    if (distance < 1.3) {
                        scene.remove(stones[i]);
                        stones.splice(i, 1);

                        scene.remove(b.mesh);
                        balloons.splice(j, 1);

                        score += 10;
                        coins += 5;

                        // Check for Level Up (Every 30 points increases the level)
                        const newLevel = Math.floor(score / 30) + 1;
                        if (newLevel !== currentLevel) {
                            currentLevel = newLevel;
                            setupSpawner(); // Adjust spawn rate for the new level
                        }

                        document.getElementById('scoreCount').innerText = score;
                        document.getElementById('coinCount').innerText = coins;
                        document.getElementById('levelCount').innerText = currentLevel;
                        break;
                    }
                }
            }

            // Update Balloons (floating downwards)
            for (let i = balloons.length - 1; i >= 0; i--) {
                balloons[i].mesh.position.y -= balloons[i].speed;

                if (balloons[i].mesh.position.y < -6) {
                    scene.remove(balloons[i].mesh);
                    balloons.splice(i, 1);
                }
            }
        }

        renderer.render(scene, camera);
    }

    animate();

    // Handle Window Resize
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
